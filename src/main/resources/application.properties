# ===================================================================
# Gym Membership Management System - Backend Configuration
# ===================================================================

# Server Port
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
# Replace 'localhost:3306', 'root', and 'your_password' with your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
# 'update': automatically updates database schema to match entity models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
# Show clear error messages in API responses
server.error.include-message=always
server.error.include-binding-errors=always
